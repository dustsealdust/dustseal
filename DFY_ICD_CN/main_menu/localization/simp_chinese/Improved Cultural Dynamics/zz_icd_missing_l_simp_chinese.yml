 icd_repression:0 "系统性迫害"
 icd_repression_desc:0 "在我国，宗教不应仅靠一纸法令加以取缔。我们将使宗教迫害制度化，严厉扼杀一切异端与异教徒。"
 icd_seven_sacraments:0 "七件圣事"
 icd_seven_sacraments_desc:0 "我们将全然接纳七件圣事，视七者皆为完整的圣事，而非仅是圣事性礼仪。"
 icd_subjugated_communities:0 "臣属社群"
 icd_subjugated_communities_desc:0 "穆斯林与犹太人获准作为受贬抑的少数群体生活于我国，其在政治与社会上所受的臣属待遇，类似于伊斯兰帝国中的齐米制度。他们需缴纳额外税赋，以换取作为我国一员的资格。"
 icd_subjugated_communities_tt:0 "[ShowReligionGroupName('muslim')] 与 [ShowReligionName('judaism')] 在 [ShowReligionGroupAdjective('christian')] [provinces|e] 中为 [protected_religions|e]"
 icd_test_coerce:0 "[ROOT.GetLocation.Custom('icd_converting_province')]\n当前每年 [forced_conversion|e] 的速度为 #color_green [ROOT.GetLocation.MakeScope.ScriptValue('icd_conversion_rate_province_forced_value')]#! [pops|e]。\n当前每年 [communal_conversion|e] 的速度为 #color_green [ROOT.GetLocation.MakeScope.ScriptValue('icd_conversion_rate_province_communal_value')]#! [pops|e]。\n\n[forced_conversion|e] 基础值：#color_green [ROOT.GetLocation.MakeScope.ScriptValue('icd_base_value')]#!\n国家 [conversion|e]：[ROOT.GetLocation.GetOwner.GetModifierValue('global_pop_conversion_speed_modifier')]\n本地 [conversion|e]：[ROOT.GetLocation.GetModifierValue('local_pop_conversion_speed_modifier')]"
 icd_tolerance_law:0 "宗教宽容"
 icd_tolerance_law_desc:0 "我们的国家应在何种程度上保护各种不同的宗教与族群。"
 icd_voluntary_conversion_map_tt:0 "当前 [heathens|e] 的 [voluntary_conversion|e] 速度为 #color_green [ROOT.GetLocation.MakeScope.ScriptValue('icd_conversion_rate_province_voluntary_value_heathen')]#!%\n当前 [heretics|e] 的 [voluntary_conversion|e] 速度为 #color_green [ROOT.GetLocation.MakeScope.ScriptValue('icd_conversion_rate_province_voluntary_value_heretic')]#!%"
 icd_witness_doctrine:0 "见证教义"
 icd_witness_doctrine_desc:0 "奥古斯丁主张，犹太人乃是基督教的见证者，是遭迫害而流散、作为永罚之活例证的存在，应任其自行其是。我们应考虑如何细化对待境内此类亚伯拉罕系少数群体的方式。"
