l_simp_chinese:
 icd_intro_event.1.title: "简介"
 icd_intro_event.1.desc: "欢迎来到「文化动态改良」(Improved Cultural Dynamics)。本模组对文化与宗教相关的方方面面做了大幅改动，旨在提升沉浸感与合理性。本事件用作模组各机制的总介绍；更多信息可在各地图模式中查看，也可在《欧洲百科》中查阅游戏概念。\n\n若你不想再看到本事件，请前往游戏规则「ICD：介绍事件」，改为「关闭介绍事件」。\n\n本模组新增的地图模式：宗教皈依地图、自愿皈依地图、公共皈依、文化多数同化、异教宽容度、异端宽容度。在地图模式搜索框输入 ICD 即可看到全部。"
 icd_intro_event.2.title: "宗教改动"
 icd_intro_event.2.desc: "声明：宗教皈依的改动可在游戏规则「ICD：宗教皈依」中关闭。\n\n本模组舍弃了原版的皈依方式，改用全新的年度皈依系统，应当更有趣。它不占用内阁席位，作用于人口而非地点；配合本模组引入的宗教保护机制，运作更自然——人口可被保护而免于皈依，同时不会阻止同地点其他人人口的皈依。\n\n新系统的缺点：数值只能通过新地图模式查看，或在地点人口视图将鼠标悬停于「每月皈依」上查看，且皈依按年结算。\n\nICD 的新系统移除了每个地点的每月皈依，并移除了「改变省份宗教」内阁行动。皈依被拆分为三类：[communal_conversion|e]、[voluntary_conversion|e] 与 [forced_conversion|e]。\n\n应对异教徒与异端的策略可归纳为：\na) 对 [heathens|e] 和/或 [heretics|e] 采取 [tolerance|e]，使一部分人通过 [voluntary_conversion|e] 皈依\nb) 在宗教菜单用「强制宗教皈依」行动对 [pops|e] 施加 [forced_conversions|e]\nc) 将人口同化到你的文化，使其通过 [communal_conversion|e] 皈依\nd) 驱逐人口（其中一部分会被皈依）\n\n入门建议：先理解宗教菜单中的「强制宗教皈依」已取代「改变省份宗教」内阁行动，再在《欧洲百科》查看各种游戏概念、ICD 地图模式以及提示菜单。"
 icd_intro_event.3.title: "文化改动"
 icd_intro_event.3.desc: "本模组规定：文化同化必须依据国家与其文化的关系遵守特定规则，由 [ShowLawName('cultural_majority_law')] 规范。[ShowPolicyName('ethnic_communities')] 是该法律最常见的政策，只允许在「紧邻你文化占主导的地点」以及「拥有你文化可观少数（10%）的地点」进行同化。\n\n与原版一样，你的每月同化量是基础 +X，经各类修正提高后，再被控制力大幅封顶。开局每个国家都有被动 +2，且可能从文化多数政策再获得 +1。人口越多的地点越难同化，人口越少则越易（很遗憾，这是原版限制）。叠加修正来提高该数值。人口增长越高越难同化；而死亡、疾病、战争等都是少数人口减少的机会。传播文化的策略：培育你的 [primary_culture|e]、在合适之处用内阁行动派遣殖民者并最大化修正，或者干脆接受文化多样性。"
 icd_intro_event.4.title: "部落民改动"
 icd_intro_event.4.desc: "部落民不再影响控制力，改为降低文化同化速度、王权与整合速度。他们会在文艺复兴时代获得部族征召兵升级与新的阶层特权。在丛林、山地、沙漠等环境中，若不用「推广部落民」内阁行动则更难清除。由于与国家的特殊关系，罗马尼、波罗的与梅里亚文化的人口不会形成部落阶层。\n\n若从丛林、热带森林或极地气候地区招募，部族征召兵不会计入强大的部落骑兵征召兵。"
 icd_intro_event.5.title: "宗教改革改动"
 icd_intro_event.5.desc: "宗教改革更慢，但更强、更一致。宗教改革经过的地点会获得「宗教狂热」修正，使宗教皈依在长达 35 至 45 年内无法进行。\n\n激进宗教改革也已加入，含 [ShowReligionAdjective('anabaptist')] 与 [ShowReligionAdjective('unitarian')] 信仰。[ShowReligionAdjective('anabaptist')]者有一个小型运动，但很弱。一位论派只出现在波兰与特兰西瓦尼亚，且没有运动。\n\n抵抗宗教改革的最佳做法，是靠耶稣会与「推动反宗教改革」内阁行动熬过它，待其自行衰落后再反击。接纳并推广宗教改革则需尽快让尽可能多的人口皈依，因为这会加速其传播。\n\n若使用新宗教机制，宗教改革会在 1565 年前后大幅提升天主教徒与新教徒的皈依，增益持续 100 年。改革期间 [forced_conversion|e] 也不会激怒人口。"
 icd_intro_event.6.title: "特定宗教改动"
 icd_intro_event.6.desc: " - 新增宗教：[ShowReligionName('southern_mahayana')]、[ShowReligionName('anabaptist')]、[ShowReligionName('unitarian')]、[ShowReligionName('alawite_religion')]、[ShowReligionName('nusantaran_hindu')]、[ShowReligionName('hyang_religion')]、[ShowReligionName('malay_folk_religion')]\n - [ShowReligionName('sanjiao')] 可使用独特的宗教要素\n - 穆斯林国家可通过「齐米地位」行动选择 [ShowEstateTypeName('dhimmi_estate')]\n - 新教徒获得新的宗教要素"
