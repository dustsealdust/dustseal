 azeri_culture_movement: "阿达尔人的阿塞拜疆化"
 azeri_culture_movement_desc: "突厥人向高加索地区的迁徙，促使阿达尔文化发生变化。阿达尔人越来越多地使用突厥语族的阿塞拜疆语，并采纳突厥习俗。所有处于突厥人或蒙古人统治下，或处于一个在文化上不接受他们但接受阿塞拜疆人的政府统治下的阿达尔人口，将逐渐变为阿塞拜疆人。"
 azeri_culture_movement_location_modifier: "阿塞拜疆文化运动地点修正"
 dutch_culture_movement: "荷兰融合"
 dutch_culture_movement_desc: "尼德兰的建立将催生与其相伴随的独特政治文化。尼德兰诸创始邦国的主体文化将率先接纳这一新身份，低地国家的其他文化则在一定程度上随之效仿。一旦这一身份认同的塑造进程启动，身处尼德兰之外的相关文化便不会那么轻易地予以认同。"
 dutch_culture_movement_location_modifier: "荷兰文化运动地点修正"
 lithuanian_culture_movement: "立陶宛民族的起源"
 lithuanian_culture_movement_desc: "立陶宛公国已将奥克什泰特人与萨莫吉蒂亚人团结为一。随着国家开启文化整合进程，一个新的民族认同与文化将在他们之中孕育而生。"
 lithuanian_culture_movement_location_modifier: "立陶宛文化运动地点修正"
 russian_culture_movement: "俄罗斯民族的形成"
 russian_culture_movement_desc: "罗斯土地的统合使得各具特色的东斯拉夫方言融入了更大的俄罗斯身份认同之下。在俄罗斯国家所接纳的东斯拉夫人中，将形成一种新的身份与文化，但那些尚未被纳入俄罗斯统治的民族则会被排除在外。"
 russian_culture_movement_location_modifier: "俄罗斯文化运动地点修正"
 ruthenian_culture_movement: "鲁塞尼亚民族形成"
 ruthenian_culture_movement_desc: "统一的鲁塞尼亚的建立，将各具特色的东斯拉夫方言融合在更广泛的鲁塞尼亚身份之下。在鲁塞尼亚国家认可的东斯拉夫人中，将形成一种新的身份与文化，但那些尚未被纳入鲁塞尼亚统治的民族将被排除在外。"
 ruthenian_culture_movement_location_modifier: "鲁塞尼亚文化运动地点修正"
 turkification_culture_movement: "蒙古人的突厥化"
 turkification_culture_movement_desc: "土耳其和蒙古文化的交融形成了独特的突厥‑蒙古身份。随着时间的推移，那些不受能够捍卫其利益的蒙古政府管辖的蒙古人，将采用土耳其语言并认同突厥身份。"
 turkification_culture_movement_location_modifier: "蒙古人突厥化地点修正"
