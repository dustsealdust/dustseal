l_simp_chinese:
 icd_minority_events.10.title: "摩里斯科人的问题"
 icd_minority_events.10.desc: "尽管我国许多[ShowCultureNameWithNoTooltip('andalusi')]已皈依我们的信仰，但我们的一些顾问仍怀疑他们持有秘密的[ShowReligionGroupAdjective('muslim')]信仰以及对其他国家的潜在忠诚。他们坚持继续使用阿拉伯语并保持独特身份，都被视为这一点的明确证据。为确保国家的完整与安全，我们可以选择驱逐他们。或者，我们也可以简单地接受他们的存在。"
 icd_minority_events.10.a: "驱逐他们！"
 icd_minority_events.10.b: "他们可以留下"
 flavor_cas.1002.title: "摩尔人的皈依"
 flavor_cas.1002.desc: "在我们征服了[ShowAreaName('granada_area')]和[ShowAreaName('andalusia_area')]之后，我们面临着大量[ShowCultureName('andalusi')]和[ShowReligionGroupAdjective('muslim')]人口作为我们的属国。宗教裁判所已开始在该地区扩展其活动，以确保人民的皈依能够顺利进行。除非[target_character.GetName]亲自干预反对宗教裁判所，否则这将确保大多数[ShowCultureNameWithNoTooltip('andalusi')]人皈依，而拒绝皈依者将被驱逐出境。"
 icd_reapply_promoting.1.title: "重新应用"
 icd_reapply_promoting.1.desc: "重新应用"
 icd_reapply_promoting.1.a: "重新应用"
 icd_minority_events.1.title: "犹太人的逃亡"
 icd_minority_events.1.desc: "我国境内[ShowReligionAdjectiveWithNoTooltip('judaism')]群体缺乏应有的保护，致使许多人对其生命安全与生活方式深感忧虑。他们与其他民众之间的紧张关系和不安情绪，已导致部分[ShowReligionAdjectiveWithNoTooltip('judaism')]家庭考虑逃离我国。为避免引发社会动荡，我们显然必须就此问题表明立场，但在究竟是彻底驱逐他们，还是赋予其法律保护的问题上，各方仍存在严重分歧。"
 icd_minority_events.1.a: "给予他们保护！"
 icd_minority_events.1.b: "或许他们应该被驱逐"
 icd_minority_events.2.title: "对[ShowEstateTypeName('dhimmi_estate')]的保护？"
 icd_minority_events.2.desc: "[ShowEstateTypeName('dhimmi_estate')]的代表最近来到我们的宫廷，详细讲述了他们因国家官员和普通民众而遭受的宗教歧视与迫害。一些人认为这种态度违背了[ShowReligionGroupName('muslim')]的原则，主张我们应向[ShowEstateTypeName('dhimmi_estate')]提供他们应得的保护。然而，若我们这样做，可能会发现难以有效地改变他们的信仰。"
 icd_minority_events.2.a: "向我们的[ShowReligionAdjectiveWithNoTooltip('judaism')]和[ShowReligionGroupAdjectiveWithNoTooltip('christian')]臣民赐予宗教保护！"
 icd_minority_events.2.b: "传播我们的教义并无坏处"
 icd_minority_events.3.title: "拜星教徒身份"
 icd_minority_events.3.desc: "拜星教徒是《古兰经》中提到的一个宗教群体，他们据称属于[ShowEstateTypeName('dhimmi_estate')]，因此应受伊斯兰教法充分保护。尽管其真实身份存疑，但我们的[ShowReligionAdjective('mandeaism')]教徒向我们声称，他们实际上就是拜星教徒，并属于“有经人”的范畴。若情况属实，那么[ShowReligionAdjective('mandeaism')]理应享有与其他有经人同等的宗教保护。"
 icd_minority_events.3.a: "他们是有经人，应该受到保护！"
 icd_minority_events.3.b: "这纯属谎言，他们不过是异教徒罢了"
 icd_minority_events.4.title: "针对犹太人的暴力"
 icd_minority_events.4.desc: "我国境内持续爆发针对[ShowReligionAdjectiveWithNoTooltip('judaism')]群体的暴力与宗教迫害事件。此类暴行与我国此前赋予这些[ShowReligionAdjectiveWithNoTooltip('judaism')]臣民的自由和保障形成了强烈反差。当这些保护措施迫使我国政府不得不维护这些犹太异教徒免受同信仰民众的侵害时，人们开始质疑赋予这些特权的正统性。鉴于针对[ShowReligionAdjectiveWithNoTooltip('judaism')]的仇恨可能升级为对政府的仇恨，我们或许应当撤销这些保护，任由[ShowReligionAdjectiveWithNoTooltip('judaism')]自行挣扎求生。"
 icd_minority_events.4.a: "我们将继续保护[ShowReligionAdjectiveWithNoTooltip('judaism')]"
 icd_minority_events.4.b: "[ShowReligionAdjectiveWithNoTooltip('judaism')]能够自食其力"
 icd_minority_events.5.title: "致犹太人的邀请"
 icd_minority_events.5.desc: "我国一些邻国的[ShowReligionAdjectiveWithNoTooltip('judaism')]人口已被证明在经济和文化上极具价值。由于他们在这些领土上面临暴力和宗教迫害的威胁，或许预先给予所有[ShowReligionAdjectiveWithNoTooltip('judaism')]人以保护是个不错的想法，希望他们能带着专业知识和技能逃离那些土地，进入我国。"
 icd_minority_events.5.a: "邀请其中少数几人，并赐予他们庇护！"
 icd_minority_events.5.b: "他们在这里永远不受欢迎"
 icd_minority_events.1001.title: "[ROOT.GetVariable('icd_expel_origin_country').GetCountry.MakeScope.GetVariable('icd_expel_culture_people').GetCulture.GetNameWithNoTooltip]人的逃亡"
 icd_minority_events.1001.desc: "[ROOT.GetVariable('icd_expel_origin_country').GetCountry.GetFullName]开始威胁其境内的[ROOT.GetVariable('icd_expel_origin_country').GetCountry.MakeScope.GetVariable('icd_expel_culture_people').GetCulture.GetNameWithNoTooltip]人口，并似乎计划大规模驱逐这些人。由于文化相近，这些[ROOT.GetVariable('icd_expel_origin_country').GetCountry.MakeScope.GetVariable('icd_expel_culture_people').GetCulture.GetNameWithNoTooltip]难民很可能会涌入我国。问题在于，我们究竟应不应该接纳他们。"
 icd_minority_events.1001.a: "欢迎这些人！"
 icd_minority_events.1001.b: "我们不会欢迎任何人。"
 icd_minority_events.1002.title: "[ROOT.GetVariable('icd_expel_culture_people').GetCulture.GetNameWithNoTooltip]人无家可归"
 icd_minority_events.1002.desc: "看起来我们驱逐[ROOT.GetVariable('icd_expel_culture_people').GetCulture.GetName]人民的尝试很可能会以失败告终，因为我们外交网络中的国家似乎都不愿意或没有能力接收他们。目前，他们只能继续作为我们的臣民。"
 icd_minority_events.1002.a: "那就这样吧"
 icd_minority_events.1003.title: "驱逐[ROOT.GetVariable('icd_expel_culture_people').GetCulture.GetNameWithNoTooltip]人"
 icd_minority_events.1003.desc: "我们已准备就绪，是时候将[ROOT.GetVariable('icd_expel_culture_people').GetCulture.GetName]人驱逐出我们的领土了。虽然无法一次全部驱逐成功，但我们将确保在至少两年内驱离相当数量的人。"
 icd_minority_events.1003.a: "让我们开始吧"
 icd_minority_events.1003.b: "仔细考虑一下的话，这是个坏主意。"
 icd_dhimmi_communities_each_israelite_custom: "[ShowReligionGroupName('israelite_group')][pops|e]目前是[ShowEstateTypeName('dhimmi_estate')]的一部分。"
 icd_dhimmi_communities_each_christian_custom: "[ShowReligionGroupAdjective('christian')][pops|e]目前属于[ShowEstateTypeName('dhimmi_estate')]"
 icd_dhimmi_communities_each_sabian_custom: "[ShowReligionGroupAdjective('mandean_group')]和[ShowReligionGroupAdjective('manichaean_group')]的[pops|e]目前属于[ShowEstateTypeName('dhimmi_estate')]"
 icd_dhimmi_communities_each_iranic_custom: "[ShowReligionGroupAdjective('zoroastrian_group')][pops|e]目前是[ShowEstateTypeName('dhimmi_estate')]的一部分。"
 icd_dhimmi_communities_each_dharmic_custom: "[ShowReligionGroupAdjective('dharmic')][pops|e]目前是[ShowEstateTypeName('dhimmi_estate')]的一部分"
 icd_dhimmi_communities_each_buddhist_custom: "[ShowReligionGroupAdjective('buddhist')][pops|e]目前属于[ShowEstateTypeName('dhimmi_estate')]"
 icd_minority_events.7.title: "齐米的地位"
 icd_minority_events.7.desc: "我们可以选择哪些[religions|e]应被视为[ShowEstateTypeName('dhimmi_estate')]的一部分。[ShowEstateTypeName('dhimmi_estate')]成员免受改宗，享有自治权和某些权利，但须缴纳吉兹亚税，日常生活中受若干限制。\n\n在低[tolerance|e]社会中，[ShowEstateTypeName('dhimmi_estate')]比其它[heathens|e]受到更多保护与自由。在高[tolerance|e]社会中，成为[ShowEstateTypeName('dhimmi_estate')]则是一种歧视。[ShowEstateTypeName('dhimmi_estate')]地位既可用作压制工具，也可用作促进宗教宽容的工具。保护程度取决于[ShowEstateTypeName('dhimmi_estate')][estate|e]的特权。当前受保护的[religions|e]：\n\n[ROOT.GetCountry.Custom('icd_dhimmi_communities_each_israelite')]\n[ROOT.GetCountry.Custom('icd_dhimmi_communities_each_christian')]\n[ROOT.GetCountry.Custom('icd_dhimmi_communities_each_sabian')]\n[ROOT.GetCountry.Custom('icd_dhimmi_communities_each_iranic')]\n[ROOT.GetCountry.Custom('icd_dhimmi_communities_each_dharmic')]\n[ROOT.GetCountry.Custom('icd_dhimmi_communities_each_buddhist')]"
 icd_minority_events.7.a: "改变犹太人和撒玛利亚人的地位"
 icd_israelite_dhimmi_remove_tt: "将[ShowReligionGroupAdjective('israelite_group')][pops|e]从[ShowEstateTypeName('dhimmi_estate')]中移除。\n关于此的更改通常会在二月初之后生效。"
 icd_israelite_dhimmi_add_tt: "将[ShowReligionGroupAdjective('israelite_group')][pops|e]纳入[ShowEstateTypeName('dhimmi_estate')]\n关于此的更改通常会在二月初之后生效。"
 icd_minority_events.7.b: "改变基督徒的地位"
 icd_christian_dhimmi_remove_tt: "将[ShowReligionGroupAdjective('christian')][pops|e]从[ShowEstateTypeName('dhimmi_estate')]中移除。\n关于此的更改通常会在二月初之后生效。"
 icd_christian_dhimmi_add_tt: "将[ShowReligionGroupAdjective('christian')][pops|e]纳入[ShowEstateTypeName('dhimmi_estate')]\n关于此的更改通常会在二月初之后生效。"
 icd_minority_events.7.c: "更改拜星教徒地位"
 icd_sabian_dhimmi_add_tt: "将[ShowReligionGroupAdjective('mandean_group')]和[ShowReligionGroupAdjective('manichaean_group')][pops|e]纳入[ShowEstateTypeName('dhimmi_estate')]\n关于此的更改通常会在二月初之后生效。"
 icd_sabian_dhimmi_remove_tt: "从[ShowEstateTypeName('dhimmi_estate')]中移除[ShowReligionGroupAdjective('mandean_group')]和[ShowReligionGroupAdjective('manichaean_group')][pops|e]\n关于此的更改通常会在二月初之后生效。"
 icd_minority_events.7.e: "改变美赞祭司的地位"
 icd_iranic_dhimmi_add_tt: "将[ShowReligionGroupAdjective('zoroastrian_group')][pops|e]纳入[ShowEstateTypeName('dhimmi_estate')]\n关于此的更改通常会在二月初之后生效。"
 icd_iranic_dhimmi_remove_tt: "从[ShowEstateTypeName('dhimmi_estate')]中移除[ShowReligionGroupAdjective('zoroastrian_group')][pops|e]\n关于此的更改通常会在二月初之后生效。"
 icd_minority_events.7.f: "更改印度教徒、耆那教徒与锡克教徒的地位"
 icd_dharmic_dhimmi_add_tt: "将 [ShowReligionGroupAdjective('dharmic')][pops|e]纳入[ShowEstateTypeName('dhimmi_estate')]\n关于此的更改通常会在二月初之后生效。"
 icd_dharmic_dhimmi_remove_tt: "从[ShowEstateTypeName('dhimmi_estate')]中移除[ShowReligionGroupAdjective('dharmic')][pops|e]\n关于此的更改通常会在二月初之后生效。"
 icd_minority_events.7.g: "改变佛教徒的地位"
 icd_buddhist_dhimmi_add_tt: "将[ShowReligionGroupAdjective('buddhist')][pops|e]纳入[ShowEstateTypeName('dhimmi_estate')]\n关于此的更改通常会在二月初之后生效。"
 icd_buddhist_dhimmi_remove_tt: "从[ShowEstateTypeName('dhimmi_estate')]中移除[ShowReligionGroupAdjective('buddhist')][pops|e]\n关于此的更改通常会在二月初之后生效。"
 icd_minority_events.7.h: "算了"
 icd_remove_dhimmi_tt: "如果我们对[heathens|e]的[tolerance|e]低于0，则每个属于受影响[religion|e]的[pop|e]将失去#color_red 15%#!的[pop_satisfaction|e]"
 icd_minority_events.31.title: "黎凡特的领导权"
 icd_minority_events.31.desc: "坐落在黎巴嫩和德鲁兹山的[ShowReligionGroupAdjective('druze_group')]和[ShowReligionAdjective('shia')]臣民，拥有他们自己的社会和政治结构。若我们想要获取这些当地人的援助并有效征召支持，就应当承认他们家园的政治现实，并授予他们世袭的宗族伊克塔职位。"
 icd_minority_events.31.a: "承认地方宗族的势力"
 icd_minority_events.31.b: "这些人是叛教者，不配享有任何政治权威"
 icd_romani_events.99.title: "异族到来"
 icd_romani_events.99.desc: "地方当局报告称，一群操着陌生语言的外来者已进入我们的土地。有人称他们是鞑靼人，有人说是埃及人，还有人称之为茨冈人或$romani_culture$。无论如何，现实是这些人似乎一贫如洗，且似乎是为了逃避我们某些邻国的剥削而来。我们的[estates|e]已经期望我们制定类似的法律，将他们视为奴隶或不受欢迎的群体，若我们不从，他们便会不满。"
 icd_romani_events.99.a: "他们可能被贵族和王室当作奴隶拥有。"
 icd_romani_events.99.b: "他们必须与社会和普通民众隔离。"
 icd_romani_events.99.c: "让我们充分利用他们所拥有的技能"
 icd_romani_events.99.d: "驱逐这些异族！"
 icd_romani_events.99.e: "他们应像其他任何人一样受到公平与正义的对待。"
 icd_romani_events.90.title: "罗姆人定居点"
 icd_romani_events.90.desc: "无论出于何种情况，我们$romani_culture$人现在已是一个独特民族。鉴于这是前所未有之局面，我们必须决定如何对待这些居民。周边一些国家已经实施剥削他们并将他们视为不受欢迎群体的法律；看来我们的[estates|e]也期待我们推行类似法规。若我们拒绝并试图予以优待或让他们融入社会，这必将招致不满。"
 icd_romani_events.4.title: "一位前途光明的罗姆顾问"
 icd_romani_events.4.desc: "$romani_culture$社区的一员，[SCOPE.sCharacter('icd_romani_cabinet_scope').GetName]因超越自己的出身并在宫廷中证明自己颇具影响力而脱颖而出。然而，他的地位并非没有批评者——宫廷中的许多其他成员因他的存在感到威胁，认为这是一种威胁。我们可以支持这位有才华的人，或者让他离开以免动摇我们的统治。"
 icd_romani_events.4.a: "支持这样的人才！"
 icd_romani_events.4.b: "他在我们的宫廷中没有立足之地"
 icd_romani_events.5.title: "一幅罗姆人的画作"
 icd_romani_events.5.desc: "我们的艺术家[SCOPE.sCharacter('icd_painting_artist_scope').GetName]受到了我们国家中$romani_culture$社区场景的启发，正在计划一幅描绘他们生活方式的大型画作。如果我们支持这样的画作，它将为我们的画廊增添宝贵的收藏。"
 icd_romani_events.5.a: "把它涂上颜色！"
 icd_romani_events.5.b: "这不值得投入"
 icd_romani_events.6.title: "吉普赛人的国王"
 icd_romani_events.6.desc: "在$romani_culture$中，一位名叫[SCOPE.sCharacter('icd_romani_king_gypsy_scope').GetName]的人因其领导力和权威而脱颖而出，其开始自称吉普赛人之王，并在职业与政治领域承担起连接$romani_culture$与非罗姆人社群关系的重要角色。若我们正式承认其地位，必将从中受益。"
 icd_king_of_the_gypsies_nickname: "吉普赛人之王"
 icd_romani_events.6.a: "这是一位真正的国王！"
 icd_romani_events.6.b: "我们不会参与这场闹剧。"
 icd_romani_events.7.title: "斯特凡·拉茲凡的崛起"
 icd_romani_events.7.entry: "斯特凡·拉茲凡的崛起"
 icd_romani_events.7.desc: "[ROOT.GetVariable('icd_stefan_razvan_variable').GetCharacter.GetName]展现出了卓越的战略才华和政治魅力，尽管出身于$romani_culture$，他却跻身社会上层，作为[ShowEstateTypeName('nobles_estate')]的一员取得了巨大成功。尤其值得一提的是，他即便在领土之外，也与$moldovan_culture$的平民百姓建立了深厚联系。在当前这段艰难时期，鉴于我们的统治者未能维持政治权威，或许应考虑让这样一位富有魅力的人物掌握一定的军事与政治影响力。当然，风险始终存在——他可能会利用这些权力和声望进一步动摇我们的统治。"
 icd_romani_events.7.a: "人才必须得到认可！"
 icd_romani_events.7.b: "秘密处决他"
 icd_romani_events.8.title: "斯特凡·拉茲凡的崛起"
 icd_romani_events.8.desc: "[ROOT.GetVariable('icd_stefan_razvan_variable').GetCharacter.GetName]已证明自己是一个有文化且具有影响力的人，并成功在我们贵族和臣民中培养了一批追随者。许多人甚至开始认为我们的统治者[SCOPE.sCharacter('icd_our_ruler_versus_stefan').GetName]相对无能和软弱。也许改变领导层的时机已经来临。Stefan在国外的联系和关系对于确保他作为领导者的成功同样重要。"
 icd_romani_events.8.a: "是时候更换领导层了"
 icd_romani_events.8.b: "立刻处决此人！"
 icd_romani_events.9.title: "一位充满威胁的领袖"
 icd_romani_events.9.desc: "我们的统治者，[ROOT.GetCountry.GetGovernment.GetRuler.GetName]，已证明在国内外的民众中颇受欢迎。[ROOT.GetCountry.GetGovernment.GetRuler.GetHisHer|U]对当地民众的激烈召集已对[SCOPE.sCountry('icd_big_country_will_invade').GetName]构成威胁，他们开始声称[ROOT.GetCountry.GetGovernment.GetRuler.GetName]及其[ROOT.GetCountry.GetGovernment.GetRuler.GetHisHer]王朝是篡位者，无权统治。他们提议在我国境内恢复正当治理。若情况继续如此，我们将面临军事干预的风险。"
 icd_romani_events.9.a: "也许贵族们能自己解决这个问题。"
 icd_romani_events.9.b: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName]不会受到威胁"
 icd_romani_events.95.title: "罗姆人地位"
 icd_romani_events.95.desc: "由于我们已取消对$romani_culture$的最新限制，我们必须考虑改变政策和方针。我们应该对他们采取何种立场？"
 icd_muslim_events.1.title: "波斯尼亚人的改宗"
 icd_muslim_events.1.desc: "$bosnian$对本地宗教的忠诚之浅令人惊讶。历史上[ShowReligionName('catholic')]与[ShowReligionName('orthodox')]在波斯尼亚的竞争削弱了当地社会的宗教基础，导致了神职与精神组织的匮乏。在此真空中得以存在的分裂派[ShowReligionAdjective('bosnian_church')]也未能创造出更强大的替代。随着我们到来并征服这片土地，当地民众对[ShowReligionGroupName('muslim')]表现出异常开放的态度，似乎愿意改宗并皈依吾等信仰。若我们着手在他们中推行传教活动，必将见证大批人改信。"
 icd_muslim_events.1.a: "向$bosnian$们传话"
 icd_muslim_events.1.b: "还要失去吉兹亚税的收入？绝不可能。"
 icd_minority_events.9.title: "驱逐克里米亚人？"
 icd_minority_events.9.desc: "我们的领土内存在[ShowCultureName('crimean')]人，已被证明阻碍了我们驯服草原的野心，并成为冲突与不和谐的根源。他们迥异的传统和信仰，以及游牧习气，使我们难以驾驭。我们日益面临抉择：是否应继续允许这些人生存在我们的土地上，试图接纳他们融入我们的社会，抑或立即将其驱逐。\n\n若我们驱逐他们，他们很可能将我们及我们的思想视为敌人，且需注意，所有使其皈依我们信仰的努力都将付诸东流。"
 icd_minority_events.9.a: "驱逐他们！"
 icd_minority_events.9.b: "让他们留下"
 icd_minority_events.1.c: "对犹太人实施限制和隔离！"
 icd_minority_events.4.c: "对犹太人实施限制和隔离！"
 icd_minority_events.8.title: "宗教暴力爆发"
 icd_minority_events.8.desc: "我国境内大量[ShowReligionAdjective('judaism')]的存在，导致了关于他们的谎言与阴谋的传播，以及对[ShowReligionAdjective('judaism')]群体的宗教暴力日益加剧。若不立即采取行动，我们或将目睹一场针对[ShowReligionAdjective('judaism')]的极为血腥的大屠杀。"
 icd_minority_events.8.a: "我们做不了什么"
 icd_minority_events.8.b: "我们现在必须行动！"
 flavor_eng.7.fallback_title: "关系恶化与摩擦在[ROOT.GetCountry.GetName]和[GetCountry('PAP').GetName]之间，正值[ShowSituationName('reformation')]之际，导致[ROOT.GetCountry.GetGovernment.GetRuler.GetName]产生了可能脱离[GetCountry('PAP').GetGovernment.GetRulerTitle]的想法。如果我们进行这次宗教分裂，我们将实际上建立一个完全脱离天主教世界的新宗教。"
 icd_dhes.2.title: "《既然荒谬至极》"
 icd_dhes.2.entry: "《既然荒谬至极》"
 icd_dhes.2.desc: "过去，[GetCountry('PAP').GetName]与[GetCountry('PAP').GetGovernment.GetRulerTitle]一直大力倡导保护犹太民族及其财产与宗教权利。然而事实证明，这些权利与现今的宗教裁判所及宗教审查实践格格不入，只要这些权利和保护措施仍然存在，[ShowReligionAdjective('judaism')]民众就几乎没有理由皈依真正的信仰。或许有必要通过一道教宗诏书来调整政策，废除[ShowReligionAdjective('judaism')]所享有的一切权利，对其施加经济限制，迫使他们生活在犹太隔离区中。"
 icd_dhes.2.a: "颁布《既然如此荒谬》，他们必须认清自己的位置"
 icd_dhes.2.b: "这未免太过残忍了。"
 icd_dhes.3.title: "教宗的《既然荒谬至极》"
 icd_dhes.3.desc: "[GetCountry('PAP').GetGovernment.GetRulerTitle]颁布教宗诏书，撤销了此前[ShowReligionAdjective('judaism')]社群享有的一切保护，此举深刻改变了他领地内[ShowReligionAdjective('judaism')]的处境。如今，[GetCountry('PAP').GetGovernment.GetRulerTitle]又开始施压，要求我们推行类似政策，将[ShowReligionAdjectiveWithNoTooltip('judaism')]隔离到犹太人区。"
 icd_dhes.3.a: "我们服从教宗"
 icd_dhes.3.b: "[GetCountry('PAP').GetGovernment.GetRulerTitle]无权干涉我们的政策"
 reformation.2.c: "这个翻译是否符合日内瓦圣经？"
 reformation.7.title: "[SCOPE.sCharacter('target_character').GetNameWithNoTooltip]"
 reformation.7.desc: "一位有影响力且充满激情的改革者[SCOPE.sCharacter('target_character').GetNameWithNoTooltip]最近抵达了我们的领土。作为[ShowReligionAdjective('calvinist')]信仰的一员，[target_character.GetNameWithNoTooltip]因其阐述该宗教更统一且更有凝聚力的神学理论而脱颖而出，这一理论迄今有望彻底改变该宗教。"
 reformation.7.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
 icd_radical_reformation.1.title: "茨维考先知"
 icd_radical_reformation.1.desc: "[ShowLocationName('wittenberg')]最近陷入了一场骚乱和民间动荡之中，因为三个来自茨维考的人，自称茨维考先知，占据了舞台中心。他们宣扬放弃儿童洗礼，转而支持信徒洗礼，以及比[GetCharacter('martin_luther').GetName]和[GetCharacter('reformer_philip_melanchton').GetName]所喜欢的更为激进的神学观点。如果这些“先知”被允许自由传教，该集镇面临的风险将是比[ShowReligionNameWithNoTooltip('lutheran')]所宣扬的更为激进的动荡。"
 icd_radical_reformation.1.a: "[GetCharacter('martin_luther').GetName]将安抚民众并谴责激进分子"
 icd_radical_reformation.2.title: "瑞士弟兄会和康拉德·格雷贝尔"
 icd_radical_reformation.2.desc: "[GetCharacter('swi_conrad_grebel').GetName]是一位传教士，他最近因在神学问题上与[ShowReligionAdjective('calvinist')]信仰的[GetCharacter('swi_huldrych_zwingli').GetName]产生分歧而崭露头角。[GetCharacter('swi_conrad_grebel').GetName]主张一种更为新颖的基督教方式，拒绝儿童洗礼，支持成人洗礼，并将个体融入更大的信徒团体。他的思想得到新宗教团体“瑞士弟兄会”其他成员的认同并在我们的人民中找到了一些追随者，且再洗礼的浪潮已开始席卷我们的领土。"
 icd_radical_reformation.2.a: "推广这个新宗教！"
 icd_radical_reformation.2.b: "流放这个傻瓜！"
 icd_radical_reformation.2.c: "我们必须消灭这些异端！"
 icd_radical_reformation.3.title: "激进爆发"
 icd_radical_reformation.3.desc: "在[SCOPE.sLocation('target_this_location').GetName]及其周边地区，有一大群人开始大规模接受[ShowReligionAdjective('anabaptist')]思想，出现了集体重新受洗和共同祈祷的现象。"
 icd_radical_reformation.3.a: "这令人担忧。"
 icd_radical_reformation.4.title: "意想不到的皈依"
 icd_radical_reformation.4.desc: "[GetCharacter('icd_caspar_schwenckfeld').GetName] 曾是一位极为重要的[ShowReligionAdjective('lutheran')]传教士，对[ShowReligionName('lutheran')]在西里西亚的传播起到了关键作用。然而，显然，[GetCharacter('icd_caspar_schwenckfeld').GetName]在近期的布道中开始质疑[ShowReligionAdjective('lutheran')]神学，并开始宣扬更接近[ShowReligionName('anabaptist')]的思想，令许多人感到惊讶。他在我们的人民中找到了新的追随者，这些人开始围绕“施文克菲尔德教会”组织起来。"
 icd_radical_reformation.4.a: "他有权改变信仰。"
 icd_radical_reformation.4.b: "也许他是对的"
 icd_radical_reformation.4.c: "我们的领地绝不容许异端存在。"
 icd_radical_reformation.5.title: "激进改革者[GetCharacter('icd_balthazar_hubmaier').GetName]"
 icd_radical_reformation.5.desc: "激进的宗教改革已降临我国！曾经被视为最严重异端的思想，如今正由一位新近到来的传教士[GetCharacter('icd_balthazar_hubmaier').GetName]大力宣扬，而我们的臣民正认真聆听他所传播的消息。"
 icd_radical_reformation.5.a: "有意思"
 icd_radical_reformation.5.b: "也许这家伙是对的"
 icd_radical_reformation.6.title: "改革者[GetCharacter('icd_michael_settler').GetName]与施莱特海姆信条"
 icd_radical_reformation.6.desc: "[GetCharacter('icd_michael_settler').GetName]最近与几位其他[ShowReligionAdjective('anabaptist')]神学家最终确定了《施莱特海姆信条》。该信条旨在作为重浸派原则的代表性声明，概述了他们的神学立场，如成人洗礼、基督教和平主义以及宗教团体的组织。"
 icd_radical_reformation.6.a: "好吧"
 icd_radical_reformation.7.title: "激进改革者[GetCharacter('icd_jacob_hutter').GetName]"
 icd_radical_reformation.7.desc: "激进宗教改革已降临我国！曾被视作最严重异端的思想，如今由一位新近抵达的传教士[GetCharacter('icd_jacob_hutter').GetName]加以宣扬，他所传播的消息为我等臣民所认真聆听。"
 icd_radical_reformation.7.a: "好吧"
 icd_radical_reformation.8.title: "激进改革者[GetCharacter('icd_john_hut').GetName]"
 icd_radical_reformation.8.desc: "激进宗教改革已降临我国！曾被视作最严重异端的思想，如今由一位新近抵达的传教士[GetCharacter('icd_john_hut').GetName]加以宣扬，他所传播的消息为我等臣民所认真聆听。"
 icd_radical_reformation.9.title: "激进改革者[GetCharacter('icd_menno_simons').GetName]"
 icd_radical_reformation.9.desc: "激进宗教改革已降临我国！曾被视作最严重异端的思想，如今由一位新近抵达的传教士[GetCharacter('icd_menno_simons').GetName]加以宣扬，他所传播的消息为我等臣民所认真聆听。"
 icd_radical_reformation.10.title: "一位论派理念"
 icd_radical_reformation.10.desc: "激进神学家[GetCharacter('icd_peter_goniadza').GetName]最近开始推广一种非常独特的宗教立场——非三位一体论。虽然在过去，异端也曾传播类似的思想，但这是[ShowSituationName('reformation')]中第一次如此激烈而有力地捍卫这一神学立场。"
 icd_radical_reformation.10.a: "这可能是个问题"
 icd_radical_reformation.11.title: "波兰弟兄会与索齐尼主义"
 icd_radical_reformation.11.desc: "在[GetCharacter('icd_peter_goniadza').GetName]奠定的基础上，一个名为“波兰兄弟会”的非三位一体宗教团体已在我们社会中建立。该社区的新来者[GetCharacter('icd_fausto_sozzini').GetName]开始推广更加透彻和结构化的神学——索齐尼主义，这导致该信仰在许多追随者中传播。"
 icd_radical_reformation.11.a: "这正成为一个问题。"
 icd_radical_reformation.12.title: "一位加尔文派传教士"
 icd_radical_reformation.12.desc: "一位[ShowReligionAdjective('calvinist')]派传教士最近被[ShowAreaName('transylvania_area')]地区的教会选为主教。他名为[GetCharacter('icd_ferenc_david').GetName]，以其学识与魅力吸引了众人的关注。"
 icd_radical_reformation.12.a: "无论他的宗教信仰如何，他似乎是一个智者。"
 icd_radical_reformation.12.b: "把他赶走！"
 icd_radical_reformation.13.title: "一位论派皈依者"
 icd_radical_reformation.13.desc: "[GetCharacter('icd_ferenc_david').GetName]皈依[ShowReligionName('unitarian')]，震惊了我们的宫廷。他否认三位一体，肯定上帝是独一、无与伦比的单一神格，还已开始向我们的人民宣扬这一异端。"
 icd_radical_reformation.13.a: "很好！"
 icd_radical_reformation.13.b: "他的观点听起来很有说服力"
 icd_radical_reformation.13.c: "我们必须杀死这个异端"
 icd_radical_reformation.14.title: "托尔达敕令"
 icd_radical_reformation.14.desc: "我们来自[ShowAreaName('transylvania_area')]的臣民，在[GetCharacter('icd_ferenc_david').GetName]所传授的智慧指引下，提出了一项新颖的政治建议：颁布一项法令，允许所有形式的基督教，包括被视作异端的教派，可以在我们的领土上选举自己的传教士。据称此举将缓解我国境内可能发生的宗教冲突。"
 icd_radical_reformation.14.a: "颁布此项宽容敕令！"
 icd_radical_reformation.14.b: "这对我们没有吸引力。"
 icd_radical_reformation.20.title: "再洗礼派的兴起"
 icd_radical_reformation.20.entry: "再洗礼派的兴起"
 icd_radical_reformation.20.desc: "与[ShowReligionName('anabaptist')]相关的末世传教士在[GetCharacter('icd_bernhard_knipperdolling').GetName]的领导下，在[ShowLocationName('munster')]取得了巨大成功，吸引了大量信徒。他们甚至开始对该市的地方政府施加政治压力，这令我们的政府感到不安。"
 icd_radical_reformation.20.a: "这非常令人担忧。"
 icd_radical_reformation.21.title: "强化再洗礼派"
 icd_radical_reformation.21.desc: "[ShowReligionAdjective('anabaptist')]传教士在[ShowLocationName('munster')]开始赢得更多信徒，形成了一场将[ShowLocationName('munster')]视为“新耶路撒冷”的救世主运动。其人数已增长到足以接管当地行政机构的地步，若不采取行动，他们已开始威胁发动叛乱。"
 icd_radical_reformation.21.a: "我们不与异端打交道"
 icd_radical_reformation.21.b: "贿赂他们的领导人，在可能的情况下进行谈判，并颠覆当地的思潮"
 icd_radical_reformation.22.title: "明斯特叛乱"
 icd_radical_reformation.22.desc: "[ShowLocationName('munster')]的人民受[ShowReligionAdjective('anabaptist')]理想指引，发动了叛乱。整座城市宣布脱离我国，并自称“新耶路撒冷”，一个具有弥赛亚使命的圣洁中心。他们由[GetCharacter('icd_jan_matthys').GetName]领导，他被认为是一位拥有神圣异象的先知人物。"
 icd_radical_reformation.22.a: "开战了！"
 icd_radical_reformation.22.b: "他们说得有道理"
