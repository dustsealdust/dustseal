 icd_reformation_push.2.title: "骑士团世俗化"
 icd_reformation_push.2.entry: "骑士团世俗化"
 icd_reformation_push.2.desc: "[ShowReligionName('lutheran')]在德意志的传播引发了关于我们骑士团未来的疑问。我们不再被需要归化的异教徒环绕，甚至我们自己的骑士也开始质疑我们在天主教中的角色。为了维持对领地的控制与权威，也许有必要与过去决裂。[GetCharacter('martin_luther').GetName]近日向[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName]建议，明智之举是改宗[ShowReligionName('lutheran')]，并将我们的国家世俗化为君主制。然而，这可能会危及我们与[GetCountry('LIV').GetName]的关系。"
 icd_reformation_push.2.a: "我们将不再是骑士团！"
 icd_reformation_push.2.b: "荒谬的提议"
 icd_livonians_will_decide: "[GetCountry('LIV').GetName]将不得不决定该怎么做"
 icd_reformation_push.3.title: "条顿骑士团世俗化"
 icd_reformation_push.3.desc: "我们得到消息，条顿人已决定世俗化并皈依[ShowReligionName('lutheran')]，从而成为了[GetCountry('PRU').GetName]国家。这让我们陷入两难，因为我们面临类似的问题：在无异教徒邻居可供转化的情况下，我们的骑士团作为军事组织是否应继续存在。我们应当决定是效仿他们，还是坚守根本并永久断绝关系。选择后者可能让我们面临风险，被敌对的邻国夹击。"
 icd_reformation_push.3.a: "我们将不再是骑士团！"
 icd_reformation_push.3.b: "我们首先是天主教徒"
 icd_reformation_push.3.c: "我们将不再是一个骑士团，但条顿人无权决定我们的未来。"
 icd_reformation_push.4.title: "世俗化"
 icd_reformation_push.4.desc: "我们皈依新教的行为已证明与我们作为神权制的本质有些不兼容。没有天主教会提供的思潮和正统性，或许最好将我们的领土世俗化，并采用更明确的君主制组织形式。"
 icd_reformation_push.4.a: "立即世俗化！"
 icd_reformation_push.4.b: "我们将成为一个新教神权国"
 icd_reformation_push.5.entry: "被新教徒包围"
 icd_reformation_push.5.title: "被新教徒包围"
 icd_reformation_push.5.desc: "从[ShowReligionName('catholic')]的转变由[GetCountry('DEN').GetName]和[GetCountry('SWE').GetName]进行并被证明相当成功。我们或许应该效仿，接受一种新的信仰。"
 icd_reformation_push.5.a: "接纳[ShowReligionName('lutheran')]"
 icd_reformation_push.5.b: "拥抱[ShowReligionName('calvinist')]"
 icd_reformation_push.5.c: "我们不感兴趣"
 icd_reformation_push.6.entry: "忏悔者"
 icd_reformation_push.6.title: "忏悔者"
 icd_reformation_push.6.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName]在早年访问过如今已是新教城市的[ShowLocationName('wittenberg')]后，对其产生了极大好感，并亲自认识了许多来自那里的[GetCharacter('martin_luther').GetName]的熟人。或许正因如此，[ROOT.GetCountry.GetGovernment.GetRuler.GetName]对[ShowReligionName('lutheran')]表现出一定好感，并有意将其立为国教。"
 icd_the_confessor: "忏悔者"
 icd_reformation_push.6.b: "不感兴趣"
 icd_reformation_push.7.title: "狂热消退"
 icd_reformation_push.7.desc: "由[ShowSituationName('reformation')]在我们领土内引发的强烈宗教热情已经消退。此前，这种热情使得国家试图改变人们信仰的做法变得不可能。现在对我们来说，这成为了一种可能。"
 icd_reformation_push.7.a: "伟大"
 icd_reformed.1.title: "安德烈亚斯·卡尔施塔特"
 icd_reformed.1.desc: "[GetCharacter('martin_luther').GetName]最精明的盟友之一已被证明是[GetCharacter('icd_reformer_andreas_karlstadt').GetName]。他本人也是一位受人尊敬的神学家，安德烈亚斯开始推动宗教改革，以对抗他眼中腐败的教会。"
 icd_reformed.3.title: "断绝关系"
 icd_reformed.3.desc: "尽管在莱比锡辩论中及之后为[GetCharacter('martin_luther').GetName]辩护，[GetCharacter('icd_reformer_andreas_karlstadt').GetName]现已明确与[GetCharacter('martin_luther').GetName]决裂，并采纳了一种在他本人看来如今已相当激进的神学。安德烈亚斯开始要求被称为“安德烈亚斯兄弟”，拒绝穿着农民服装以外的任何服饰，呼吁废除圣像崇拜，并开始推广更接近[ShowReligionAdjective('calvinist')]传统和茨维考先知们的立场。"
 icd_reformed.3.a: "对他有好处"
 icd_reformed.3.b: "他听说过[ShowReligionName('anabaptist')]吗？"
 icd_reformed.5.title: "斯特拉斯堡的传教士"
 icd_reformed.5.desc: "我们的城市[ShowLocationName('strasbourg')]在最近几周脱颖而出，成为大量新教传教士开始活动的城市。这些传教士分属不同的神学传统，其中两人的影响力尤为突出。[GetCharacter('icd_matthaus_zell').GetName]是[ShowReligionName('lutheran')]的支持者；在他最近结婚后，他的妻子成为[ShowLocationName('strasbourg')]第一位与牧师结婚的市民。[GetCharacter('icd_martin_bucer').GetName]则在[ShowReligionName('lutheran')]和[ShowReligionName('calvinist')]之间扮演了重要的调解者角色，不过他本人更倾向于[ShowReligionAdjective('calvinist')]。"
 icd_reformed.5.a: "有趣"
 icd_reformed.8.title: "对新教的接纳"
 icd_reformed.8.desc: "自从[GetCharacter(icd_caspar_schwenckfeld).GetName]开始在我们的领土上传道以来，他已在很大程度上成功传播了[ShowReligionAdjective('lutheran')]信仰。最近，他的布道甚至传入了我们的宫廷，许多人对[ShowReligionName('lutheran')]日益抱有同情之心。"
 icd_reformed.8.a: "也许我们应该接受[ShowReligionName('lutheran')]。"
 icd_reformed.8.b: "这对我们没有吸引力。"
 icd_munster_radicals_gather_tt: "一些[pops|e]将变成[ShowReligionAdjective('anabaptist')]激进分子。"
 icd_munster_radicals_gather_more_tt: "许多[pops|e]将成为[ShowReligionAdjective('anabaptist')]激进分子。"
 icd_reformation_push.8.title: "对天主教的新式拒绝"
 icd_reformation_push.8.desc: "[ShowSituationName('reformation')]的爆发带来了对[ShowReligionName('catholic')]的新一轮拒绝，这些拒绝脱离了该思潮，正如我们曾经所做的那样。这些新宗教带来了对世界的新见解。我们可以允许它们在我们的领土上传播，或者我们可以公开拒绝并反对任何改变我们现有信仰的尝试。"
 icd_reformation_push.8.a: "我们不想和他们有任何瓜葛"
 icd_reformation_push.8.b: "让我们看看他们有什么要说的"
 icd_reformation_push.9.title: "加尔文的影响"
 icd_reformation_push.9.desc: "[GetCharacter('john_calvin').GetName]已被证明在争取我们人民支持方面颇有手段。他成功说服政府通过了《教会法令》，确立了牧师职能，并开始游说修改《民事法令》。这些举措共同将有效地把我们的国家转变为一个[ShowReligionAdjective('calvinist')]政权。\n\n反对他的则是一群来自富裕权势家族、自称“灵修派”的人，他们也开始试图攫取权力以利于己方，最终目标是尽可能流放[GetCharacter('john_calvin').GetName]。"
 icd_reformation_push.9.a: "[GetCharacter('john_calvin').GetName]战胜了反对派"
 icd_reformation_push.9.b: "[GetCharacter('john_calvin').GetName]遭到流放"
 icd_reformation_push.9.c: "陷入僵局"
 icd_reformation_push.10.title: "日内瓦学院与传教工作"
 icd_reformation_push.10.desc: "在成功改变我们的国教之后，[GetCharacter('john_calvin').GetName]现在希望通过教育和对外行动来传播他的宗教。他计划组建日内瓦学院，作为一所神学院，专注于为我们国家培养文官和牧师，并派遣其中一些受过教育的神职人员前往[GetCountry('FRA').GetName]执行传教任务。"
 icd_reformation_push.10.a: "听起来是个好主意"
 icd_reformation_push.10.b: "惹怒法国人？没门。"
 icd_reformed.10.title: "改革者[GetCharacter('icd_caspar_olevian').GetName]"
 icd_reformed.10.desc: "最近有一位[GetCharacter('icd_caspar_olevian').GetName]来到我们的土地，他是一位[ShowReligionAdjective('calvinist')]神学家，开始推崇加尔文的教义，而非[ShowReligionName('lutheran')]的教义。如果我们欢迎他进入我们的领土，并在当地的大学给他一个职位，这可能意味着我们民众宗教信仰的重大转变。"
 icd_reformed.10.a: "张开双臂欢迎他"
 icd_reformed.10.b: "他不该在此地"
 icd_conversion_events.1.entry: "波斯尼亚人的改宗"
 icd_conversion_events.2.title: "伊斯兰压力"
 icd_conversion_events.2.desc: "我们的[ShowReligionAdjective('tengri')]信仰正受到组织更为严密的[ShowReligionGroupName('muslim')]的挑战。国内一些[ShowReligionAdjective('sunni')]学者与领袖不断向宫廷施压，频繁造访宫廷，企图劝说君主改宗皈依这一新信仰。"
 icd_conversion_events.2.a: "荒谬！"
 icd_conversion_events.2.b: "这些[ShowReligionGroupAdjectiveWithNoTooltip('muslim')]说的或许有些道理"
 icd_conversion_events.3.title: "佛教传教士"
 icd_conversion_events.3.desc: "喇嘛们已来到我国，传授佛陀教义并弘扬密法。他们在宫廷中颇具影响力，许多人开始质疑我们对[ShowReligionAdjective('tengri')]信仰的独尊地位，转而建议我们改奉喇嘛们的[ShowReligionAdjective('tibetan_buddhism')]宗教。"
 icd_conversion_events.3.a: "荒谬！"
 icd_conversion_events.3.b: "这些[ShowReligionAdjectiveWithNoTooltip('tibetan_buddhism')]信徒的观点或许不无道理"
 icd_conversion_events.3.c: "邻国中国的僧侣有何见解？"