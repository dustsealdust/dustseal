l_simp_chinese:
 cultural_majority_law: "文化多数派"
 cultural_majority_law_desc: "决定大型社群对其所辖领土的自治权与各项特权。"
 minority_rule: "少数群体权利"
 minority_rule_desc: "我们政治精英的文化认同与绝大多数民众并不一致。为了治理我们的领土，我们必须允许其他文化拥有一定程度的自治和政治存在。"
 persianate: "波斯化"
 persianate_desc: "尽管我们政治精英的文化身份完全独立且与众不同，但我们深受波斯文化影响，我们的宫廷反映了波斯习俗，政府使用波斯语进行交流。"
 cultural_manifestation_privileges: "文化赞助"
 cultural_manifestation_privileges_desc: "我们鼓励国家与地方的精英阶层赞助并支持各文化少数群体及其节庆活动与宗教仪式。"
 guild_restrictions: "行会限制"
 guild_restrictions_desc: "文化少数群体往往被限制加入行会、组建自己的经济或专业团体，从而被迫融入我们的国家体制。"
 self_governing_institutions: "自治机构"
 self_governing_institutions_desc: "我们领土内的文化少数群体保留了一定程度的政治和社会自治，能够在特定空间内自行组织政治、法律和社会活动。"
 icd_privileges_in_hungary: "匈牙利特权"
 icd_privileges_in_hungary_desc: "在匈牙利王国境内，各类社群与民族享有不同程度的政治与文化自治权——例如瓦拉几亚法律、特兰西瓦尼亚自治权、日耳曼集镇权利等。作为这些特权的交换条件，这些社群需在军事与政治上支持匈牙利王国。"
 assertive_assimilation: "文化中央集权"
 assertive_assimilation_desc: "各民族文化通过我们的官僚体系与思潮得以彰显，这些思潮对少数族群施加了强大的中央权威。"
 icd_politics_of_language_law: "语言政治"
 icd_politics_of_language_law_desc: "除了诉讼用语的问题之外，我们还必须明确本国境内各通行语言的立场。"
 monolingual_courts: "单一语言"
 monolingual_courts_desc: "司法法庭、地方议会及所有其他政府场所的一切事务均须使用我们的主要共同语言。地方语言不得在公共领域中扮演任何角色。"
 language_of_opportunity: "主流语言"
 language_of_opportunity_desc: "尽管在一定程度上允许使用地方语言，但大多数公共事务仍以我们的主要通用语言处理。任何希望提升自身地位、改善生活境遇的人，都必须掌握我们的语言并融入主流。"
 linguistic_autonomy: "语言自由"
 linguistic_autonomy_desc: "各社群在使用本民族语言开展工作和处理事务方面拥有很大程度的自治权。"
 language_of_the_elites: "习得精英语言"
 language_of_the_elites_desc: "我们的共同语言是精英与受过教育者的语言，而非大众的语言。我们必须维护语言的尊严与力量，并防止我们的言语被贱民玷污。"
 ordinance_of_villers_cotterets: "维莱‑科特雷法令"
 ordinance_of_villers_cotterets_desc: "所有法律文件、公证合同及官方立法必须使用法语，不再使用拉丁语。若此项政策造成方言使用上的困难，亦别无他法。"
 linguistic_exchange: "世界通用语"
 linguistic_exchange_desc: "通过在政府和宫廷中采用并使用外语，我们使国家与更广阔的世界和社会紧密相连。跨越国界的纽带有助于我们博采众长，并以全新体验丰富国家与社会。"
 religious_and_ritual_regulation: "监管机构"
 religious_and_ritual_regulation_desc: "我们领土内的所有宗教和文化礼仪都应由一个政治机构监督，文化或宗教团体的成员必须遵守相应机构发布的法规。"
 cultural_religious_subversion: "文化和宗教限制"
 cultural_religious_subversion_desc: "文化和宗教密不可分，为了确保我们的人口不会在宗教或文化上出现偏离，我们必须让领土内的所有人都融入我们的信仰与身份认同。那些不符合我们世界观的传统、习俗、信仰和文本应受到抑制，并在必要时予以清除。"
 icd_national_identity_law: "国家认同"
 icd_national_identity_law_desc: "各民族之间想象共同体的建构，既可成为国家治理的利器，亦可能酿成分裂与纷争。我们必须明确，我们的国家应当以何种共同体与身份认同为根基。"
 civic_nationhood: "公民国家"
 civic_nationhood_desc: "我们的国家是一个单一民族的民族国家。这个民族由其文化、价值观和传统所定义，而非必然依赖于血缘关系。"
 ethnic_identity: "民族认同"
 ethnic_identity_desc: "我们的民族认同源自共同的血缘、历史与族群纽带，我们是一个有着悠久渊源的民族。"
 subjecthood: "臣属关系"
 subjecthood_desc: "我国的国家认同依托于其君主制以及与统治王朝的紧密联系而得以维系。"
 union_of_many: "多国联盟"
 union_of_many_desc: "我们的国家无疑由众多民族组成，但并不由其中任何一个所定义。我们的政治构建起桥梁，连接着领土上的各族人民。"
 religious_community: "宗教共同体"
 religious_community_desc: "我们的国家由其信仰和宗教所定义，将所有人民团结在一个超国家宗教共同体之下。"
 icd_no_inquisition_tt: "在[ShowLawName('icd_tolerance_heretic_law')][law|e]中启用[policies|e]"
 icd_no_inquisition: "克制宗教裁判"
 icd_no_inquisition_desc: "我国将不会与任何宗教裁判所公开合作"
 icd_jewish_charter: "犹太特许状"
 icd_jewish_charter_desc: "通过颁布一项特许状，保护我方领土内犹太社群的各项权利，包括法律保障、居留权、贸易自由以及宗教自治，我们便能确保我方城镇与当地犹太社群共同繁荣。"
 standardised_system_of_education: "标准化教育"
 standardised_system_of_education_desc: "一个标准化的教育体系将使我们不仅能够大大改善全民受教育的机会，还能确保我们推广反映国家价值观的统一文化。"
 national_identity: "国家认同"
 national_identity_desc: "一个国家，一个民族。我们已觉醒于自身的统一与认同，若想占据更广的疆域，就必须将其传播。"
 regional_autonomy: "多文化社会"
 regional_autonomy_desc: "我们的社会并非源于单一文化，而是由多种截然不同的身份认同所构成。我国的不同地区被赋予了不同程度的自治权。"
 ethnic_communities: "逐步整合"
 ethnic_communities_desc: "我们鼓励那些最接近我们主流文化的社群和少数群体采纳我们的方式，并学习我们的行为。然而，较为偏远的地区则可以自由保留他们自己的安排。"
 monocultural_opportunity: "大规模同化"
 monocultural_opportunity_desc: "我们的社会建立在单一文化之上，并且也只推广这一种文化。正因如此，我们的国家所到之处，都会致力于传播和弘扬我们的文化态度与传统。"
 dialects_of_german: "多元日耳曼认同"
 dialects_of_german_desc: "世界上有很多种日耳曼人，虽然我们只代表其中特定的一种，但我们承认并珍视彼此之间存在的差异。"
 dialects_of_arabic: "多元阿拉伯身份"
 dialects_of_arabic_desc: "世界上有很多种阿拉伯人，虽然我们只代表其中特定的一种，但我们承认并珍视彼此之间存在的差异。"
 dialects_of_italian: "多元意大利身份"
 dialects_of_italian_desc: "世界上有很多种意大利人，虽然我们只代表其中特定的一种，但我们承认并珍视彼此之间存在的差异。"
 colonial_culture: "殖民同化"
 colonial_culture_desc: "基于剥削、殖民化和瓦解当地文化机构的殖民结构，使得同化更高效且更具经济生产力。"
 minority_rule_tt: "采用此政策时，人口只会同化为其省份的优势文化，而忽略国家的首要文化。该政策对首要文化构成风险，因为首要文化少数群体将被同化到各自地点的优势文化中。此时减少文化同化比增加更可取。此政策只能通过使用“促进文化”内阁行动来更改。“标记”内阁行动被禁用。"
 regional_autonomy_tt: "在此政策下，人口只会同化至其所在省份的优势文化，无论国家的主流文化如何。该政策使得你的主流文化人口迁移至优势文化地点无效。这一设定只能通过“推广文化”内阁行动或“标记”内阁行动来改变，二者会在所作用的省份内暂时调整这一机制。"
 ethnic_communities_tt: "在此政策下，人口只会同化至其所在省份的优势文化，除非其邻接你的主体文化，或这些省份中存在属于你主体文化的重要少数民族。此政策刺激主体文化从其边界及定居者向外扩散，同时保护较远的其他文化。这一机制只能通过“推广文化”内阁行动或“标记”内阁行动加以改变，二者会在所作用的省份内暂时扭转这一动态。"
 monocultural_opportunity_tt: "根据此政策，人口将同化至该国的主流文化，除非使用了推广文化内阁行动或标记内阁行动。"
 dialects_of_german_tt: "采用此政策时，日耳曼文化的人口不会被同化（捷克、低地法兰克和弗里西亚除外）。非日耳曼人口会被邻近的日耳曼文化同化。“推广文化”内阁行动或“标记”内阁行动可以覆盖此效果。"
 dialects_of_arabic_tt: "根据此政策，阿拉伯文化的人口不会被同化（不包括叙利亚文化）。非阿拉伯人口将被同化至邻近的阿拉伯文化。“推广文化”内阁行动或“标记”内阁行动可以覆盖此效果。"
 dialects_of_italian_tt: "采用此政策时，意大利文化的人口不会被同化。非意大利人口会被邻近的意大利文化同化。“推广文化”内阁行动或“标记”内阁行动可以覆盖此效果。"
 icd_nothing_price: "无需花费"
 new_foreign_cultural_law: "文化少数群体"
 new_foreign_cultural_law_desc: "我国境内存在若干少数民族，这要求我们制定专门的政策与思潮来妥善应对。"
 this_policy: "这个"
 this_policy_desc: "这个"
 icd_abolished_inquisition: "宗教裁判所已被废除"
 icd_abolished_inquisition_desc: "宗教裁判所已被法令废除，在我们的领土上不再拥有任何权力或权威。"
 icd_distinct_civilizations_tt: "在存在某种主要宗教社群的地方："
 icd_faiths_of_the_folk_tt: "在我们[primary_culture|e]的[pops]数量超过我们[religion|e]的[pops|e]的地方："
 icd_faiths_of_the_folk_tt_two: "当我们的[primary_culture|e]的[pops]数量等于或少于我们的[religion|e]的[pops|e]时："
 icd_ecumenic_traditions_tt: "如果有[ShowReligionAdjective('orthodox')]或[ShowReligionAdjective('catholic')]社区且没有其他异端："
 icd_jewish_ghetto_tt: "在存在一个[ShowReligionAdjective('judaism')]社群且无异教徒的地方："
 icd_jewish_charter_tt: "如果存在[ShowReligionAdjective('judaism')]社区且没有异端或异教徒："
 icd_muslim_morerias_tt: "在存在[ShowReligionGroupAdjective('muslim')]或[ShowReligionAdjective('judaism')]社群的地方："
 ethnoreligious_integration: "民族宗教融合"
 ethnoreligious_integration_desc: "我们的文化和伊斯兰教密不可分。随着我们向东西两方不断扩张，若能先行同化异域文化，那些信仰各异的族群便更容易皈依我教。"
 icd_vlach_law: "弗拉赫法"
 icd_vlach_law_desc: "通过允许我们的瓦拉几亚臣民遵循罗马尼亚普通法，我们可以尊重他们的传统生活方式，并通过他们畜牧业带来的动物产品与邻近社区交易而从中获利。"
 icd_entrenched_tribal_livelihood: "根深蒂固的部落结构"
 icd_entrenched_tribal_livelihood_desc: "我们社会边缘的去中心化社区已根深蒂固，与其所居之地密不可分。任何驱逐他们的企图都将遭遇激烈抵抗。或许我们别无选择，只能接受他们的存在。"
 icd_tribal_governorates: "部落总督区"
 icd_tribal_governorates_desc: "通过让我方社会中的部落成员担任总督并加入行政精英阶层，我们得以进入普通文官难以管控的村庄与定居点。"
 icd_frontier_armed_tribesmen: "武装边疆民"
 icd_frontier_armed_tribesmen_desc: "在我们的边境线上，我们已授予各支半游牧部族持枪自卫与开发土地的特权。他们的助力对于捍卫边疆至关重要。"
 icd_tribal_cavalry_logistics: "部落骑兵后勤"
 icd_tribal_cavalry_logistics_desc: "通过倚重游牧与半游牧骑兵为我军提供补给与支援，我们得以更深入、更迅速地挺进敌方领土。"
 icd_tribal_commercial_networks: "分散的商业网络"
 a_tribal_cavalry_renaissance: "后期部落骑兵"
 icd_tribal_commercial_networks_desc: "我们社会中的部落民商业活动非常活跃。认识到并赞助这一现实，使我们能够获得他们的知识和专长。"
 a_tribal_cavalry_renaissance_desc: "许多生活在国家边境的部落以饲养马匹和牛群为生，终其一生与这些动物相伴，自然能在族群中培养出优秀的骑手。\n\n每当有强者偶尔将这些难以约束的战士组织成半成型的队伍时，他们便会成为一支迅捷且出奇有效的力量。"
 a_tribal_cavalry_discovery: "部落长矛兵"
 a_tribal_cavalry_discovery_desc: "许多生活在国家边境的部落以饲养马匹和牛群为生，终其一生与这些动物相伴，自然能在族群中培养出优秀的骑手。\n\n每当有强者偶尔将这些难以约束的战士组织成半成型的队伍时，他们便会成为一支迅捷且出奇有效的力量。"
 unlock_tribal_cavalry_renaissance_advance: "后期部落骑兵"
 unlock_tribal_cavalry_renaissance_advance_desc: "许多生活在国家边境的部落以饲养马匹和牛群为生，终其一生与这些动物相伴，自然能在族群中培养出优秀的骑手。\n\n每当有强者偶尔将这些难以约束的战士组织成半成型的队伍时，他们便会成为一支迅捷且出奇有效的力量。"
 unlock_tribal_cavalry_discovery_advance: "部落长矛兵"
 unlock_tribal_cavalry_discovery_advance_desc: "许多生活在国家边境的部落以饲养马匹和牛群为生，终其一生与这些动物相伴，自然能在族群中培养出优秀的骑手。\n\n每当有强者偶尔将这些难以约束的战士组织成半成型的队伍时，他们便会成为一支迅捷且出奇有效的力量。"
 icd_unify_the_tribes: "统一部族"
 icd_unify_the_tribes_desc: "我们的人民过于分裂。通过维持更清晰、更具凝聚力的核心文化、语言和认同，我们可以将不同的氏族和社区融合成一个更伟大的整体。"
 icd_unify_the_tribes_tt: "启用部落民众同化"
 icd_invite_german_settlers_tt: "每个拥有相当规模日耳曼族群的地点："
 any_accepted_culture_all: "任一已接纳文化："
 any_tolerated_culture_all: "任一相容文化："
 icd_german_language_tt: "语言不是日耳曼语"
 icd_romanian_language_tt: "语言不是罗马尼亚语"
 icd_lingering_german_communities: "残留的日耳曼社群"
 icd_lingering_german_communities_desc: "尽管我们已经停止接纳日耳曼定居者和移民，但那些已经在我们社会中占有一席之地的日耳曼人仍然是一个强大的政治和文化群体。若想将他们融入我们的政体，就需要削减他们的一部分特权。"
 ecumenic_traditions: "普世传统"
 ecumenic_traditions_desc: "社会秩序以及我国对不同宗教的接纳，促进了不同宗教社群成员的融合与统一。"
 jewish_banned_tt: "我们尚未决定驱逐或剥夺我方犹太人口的保护"
 icd_romani_privilege_tt: "每个[location|e]中拥有[ShowCultureName('romani_culture')]、[ShowCultureName('domari_culture')]或[ShowCultureName('lomari_culture')]的[ShowPopTypeName('tribesmen')]："
 icd_romani_slaves: "罗姆奴隶"
 icd_romani_slaves_desc: "罗姆人将被组织成一套严格的奴隶制度，可以在贵族、王室和拥有土地的修道院之间买卖。他们被用作家庭奴隶、田间奴隶以及从事其他劳动。"
 icd_anti_romani_laws: "反罗姆人法"
 icd_anti_romani_laws_desc: "罗姆人可获得的机遇受到严重限制，他们的自由也遭到阻碍。他们拥有土地的能力有限，不允许参与教堂礼拜，并被禁止成为行会成员。他们被期望与社会隔离，只能有限地接触社会。"
 icd_romani_craftsmen: "罗马工匠"
 icd_romani_craftsmen_desc: "罗姆人被视作一个独立的职业阶层。他们仍备受盘查、活动受限，但在其他方面则被允许公开从事各类行当，如枪械制造、冶炼、镀锡、筛子制作等。"
 icd_dhimmi_communities_protection: "保护契约"
 icd_dhimmi_communities_protection_desc: "一个[ShowReligionGroupAdjective('muslim')]国家与其[ShowEstateTypeName('dhimmi_estate')]臣民之间通过一项保护契约——ʿaqd al-dhimma——紧密相连。根据该契约，[ShowEstateTypeName('dhimmi_estate')]不得被强迫改信任何宗教，且必须被允许安全自由地实践其信仰。作为回报，他们需缴纳吉兹亚税，并遵循确保对[ShowReligionGroupAdjective('muslim')]统治者表示尊重的原则。然而，问题在于这些保护应在多大程度上得以维持，以及哪些社群应享有这些保护。决定哪些信仰属于[ShowEstateTypeName('dhimmi_estate')]，以及是否应完全保护其信仰，这只有我们的国家才能回答。"
 icd_dhimmi_communities_trigger_tt: "每个有[ShowEstateTypeName('dhimmi_estate')]社群存在的[location|e]："
 icd_dhimmi_communities_allow_tt: "必须承认[ShowEstateTypeName('dhimmi_estate')]"
 icd_dhimmi_communities_revoke_tt: "只有在国家未承认任何[ShowEstateTypeName('dhimmi_estate')]的情况下，方可予以撤销。"
 icd_permitted_restoration: "允许的复国"
 icd_permitted_restoration_desc: "允许[ShowEstateTypeName('dhimmi_estate')]自由修复和恢复宗教建筑及礼拜场所，无需请求当地[ShowReligionGroupAdjective('muslim')]当局的特别授权。这种许可加强了[ShowEstateTypeName('dhimmi_estate')]的自由，使他们更加满意，但代价是削弱了我们改宗的努力。"
 icd_permission_for_awqaf: "瓦克夫许可"
 icd_permission_for_awqaf_desc: "[ShowEstateTypeName('dhimmi_estate')]中那些缺乏合适继承人的富裕成员可能会选择在遗嘱中将慈善捐赠（瓦克夫）分配给宗教机构和宗教团体。虽然许多人认为此类捐赠是在帮助加强和传播异教，但允许这种机制会让我们的民众更幸福。"
 icd_sufi_coexistence: "苏菲派调和主义"
 icd_sufi_coexistence_desc: "苏菲教团在弥合穆斯林与非穆斯林之间分歧方面发挥着重要作用。他们的仪式和实践常被视为与齐米现有的仪式相似，通过允许苏菲派在跨宗教关系中占据重要地位，我们鼓励异教徒寻求苏菲派的建议和智慧，并将其部分信仰与伊斯兰教融合。"
 icd_abandon_the_ghiyar: "放弃吉亚尔"
 icd_abandon_the_ghiyar_desc: "吉亚尔是规定非穆斯林可以穿什么以及如何行为的一些规约。通过放松和放弃其中部分规则，我们弥合了穆斯林与非穆斯林之间的隔阂，使[ShowEstateTypeName('dhimmi_estate')]的生活不再充满敌意和分裂。"
 icd_druze_emirs: "世袭的黎凡特埃米尔"
 icd_druze_emirs_desc: "允许在黎巴嫩山、德鲁兹山、阿迈勒山及周边区域进行伊克塔任命，使其实际上成为世袭制，在黎凡特当地什叶派、德鲁兹派和马龙派王朝之间兄弟相传、父子相继，我们确保在这部分黎凡特地区拥有强大的盟友。他们将更愿意以军事支持来换取宗教和政治自主权。"
 icd_ethnoreligious_integration_tt: "在我们[primary_culture|e]人口多于[ShowReligionGroupAdjective('muslim')]人的所有地点："
 icd_tolerance_own: "国家与宗教"
 icd_tolerance_own_desc: "国家与其主要宗教之间的关系必须加以确立。"
 icd_sanction_of_faith: "经由宗教认可"
 icd_sanction_of_faith_desc: "我们的宗教使我国和统治者的政治权威合法化并加以巩固。"
 icd_confessional_state: "宗教国家"
 icd_confessional_state_desc: "一国一教。推行和维护我们的信仰是我们的主权权利，因为我们的国家与信仰密不可分。政府的宗教塑造了被统治者的宗教。"
 icd_secular_state: "世俗国家"
 icd_secular_state_desc: "政教分离是我国政府的一项基本准则，宗教不再干预公共事务。"
 icd_proselytism_heathen: "对异教徒的传教"
 icd_proselytism_heathen_desc: "我国公开配合传教活动，试图引导宗教异端皈依真正信仰。"
 icd_repressive_conversion_heathen: "对异教徒的强制皈依"
 icd_repressive_conversion_heathen_desc: "接受我们的宗教不再是选择。那些不认同我们信仰的人，必须被强迫和威胁来改宗。"
 icd_proselytism_heretic: "对异端的传教"
 icd_proselytism_heretic_desc: "我国公开配合改宗尝试，力图引导宗教异见者归顺正统信仰。"
 icd_repressive_conversion_heretic: "强制改宗异端"
 icd_repressive_conversion_heretic_desc: "接受我们的宗教不再是选择。那些不认同我们信仰的人，必须被强迫和威胁来改宗。"
 icd_syncretic_persuasion: "综摄说服"
 icd_syncretic_persuasion_desc: "正是信仰将我们团结在一起，而非语言或族群。宗教超越了文化的疆界与界限，而我们的信仰有时也须顺应当地的传统与习俗，而非反之。"
 icd_distinct_civilizations: "文明的分裂"
 icd_distinct_civilizations_desc: "每一个文化文明，即便我们认为它逊于我们的文明，也应当被允许保留自己的历史与宗教。对异教徒的皈依仅及于那些在我们看来缺乏真正建制化宗教的人。"
 icd_integrated_religions_policy: "已接受"
 icd_integrated_religions_policy_desc: "一些外来宗教已被证明是我国国家体制中不可或缺的重要组成部分，理应得到承认与保护。"
 icd_protected_faiths_policy: "受保护的社区"
 icd_protected_faiths_policy_desc: "我国境内异教徒众多，为避免社会与政治动荡，我们有必要对其宗教予以保护。"
 icd_aljama_communities: "阿尔哈马社区"
 icd_aljama_communities_desc: "犹太人和穆斯林社群被允许居住在与大多数人隔离开来的特定区域——犹太区和摩尔人区，在那里，他们与当地主教达成协议，获得一定程度的宗教和政治自治。"
 icd_sulh_i_kul: "普世和平"
 icd_sulh_i_kul_desc: "“普世和平”政策是神圣信仰神学的政治体现，它承认统治者是所有宗教的代表——所有宗教都应被自由实践，所有信徒都应获得政治代表权。"
 icd_jewish_ghetto: "犹太隔离区"
 icd_jewish_ghetto_desc: "犹太人可以在我们的领土上不受干扰地居住，但被限制在隔离区内生活。他们被禁止从事大多数职业，并且被迫穿着特殊服装。"
 light_unto_the_nations: "万国之光"
 light_unto_the_nations_desc: "犹太教无需通过传教工作来传播，也不需要让非犹太人皈依。犹太人的角色在于充当导师和引导者——从精神与道德上指导那些较弱的信仰，而非将其消灭。"
 icd_exalted_dhimmi: "齐米的首要地位"
 icd_exalted_dhimmi_desc: "齐米应得到最谨慎和原则性的对待。任何机会都不应被剥夺，任何权利也不应真正被拒之门外。"
 icd_yassa_tolerance: "对大扎撒的宽容"
 icd_yassa_tolerance_desc: "大札撒规定，只要遵守其法律，所有民族都可以信仰自己愿意相信的，并实践他们想要的宗教。"
 icd_inquisition: "宗教裁判所"
 icd_inquisition_desc: "我国对异教徒的宗教政策已移交至宗教裁判所。"
 icd_liberty_of_conscience: "信仰自由"
 icd_liberty_of_conscience_desc: "各民族皆有权奉行自己的信仰与教义，得依其自身之道德准则行事。宗教自由乃健康社会之基石。"
 icd_ecumenic_traditions: "普世传统"
 icd_ecumenic_traditions_desc: "在天主教与东正教两大世界接壤的边境线上长期共存的历史，使我们的社会不得不保持一定程度的宽容。"
 icd_edict_of_torda: "托尔达敕令"
 icd_edict_of_torda_desc: "一项法令，授权社区选举自己的传教士并实践自己的基督教形式，即便是那些可能被视为过于激进或极端的教义。"
 icd_dharmic_coexistence: "正法共存"
 icd_dharmic_coexistence_desc: "我们的达摩宗教历来共存于相似的社会文化领域中，并彼此公开交流。尽管偶尔会发生暴力与不宽容现象，但通过审慎的政策，这些是可以避免的。"
 icd_islamic_orthopraxy: "伊斯兰正统实践"
 icd_islamic_orthopraxy_desc: "我国深受伊斯兰教各派别之影响。只要恪守并践行伊斯兰教的五大支柱，我们便无需过分拘泥于具体的教义与信条。"
 icd_faiths_of_the_folk: "相互关联的民间信仰"
 icd_faiths_of_the_folk_desc: "我们的宗教并不秉持排他性观念。践行我们的信仰就是践行我们的文化，正如世界上存在多种多样的文化形式，每一种文化也可以与多种信仰相维系。只要这些信仰不过分偏离我们的世界观，我们就能像容忍其他文化一样，在社会中容忍不同的宗教存在。"
 icd_tolerance_heathen_law: "国家与异教徒"
 icd_tolerance_heathen_law_desc: "国家与背离其宗教的异教徒之间的关系必须加以规范。"
 icd_tolerance_heretic_law: "国家与异端"
 icd_tolerance_heretic_law_desc: "国家与其教义相背离的异端之间的关系必须加以规范。"
 icd_custodians: "信仰的守护者"
 icd_custodians_desc: "我们于世之使命，并非广布福音、劝人皈依，而是为那些奉行较次宗教之人提供道德指引与教化。唯有在末世降临之时，吾等之信仰方得昭彰于天下。"
 icd_city_of_faiths: "宗教改革避风港"
 icd_city_of_faiths_desc: "我们的城市将欢迎多种基督教信仰，且所有信仰都应享有同等的实践权利。"
 icd_minority_religion: "少数宗教"
 icd_minority_religion_desc: "我们的国家由文化与宗教上的少数群体统治。不仅在语言和文化上我们人数处于劣势，我们的信仰也可能难以在臣民中传播。"
 icd_god_monarchy: "神化君主"
 icd_god_monarchy_desc: "我们的统治者不仅是神的代表或由神所合法化；我们的统治者本身就是神之一——一位活生生的神祇。"
 icd_privatization_of_religion: "宗教私有化"
 icd_privatization_of_religion_desc: "奉行儒家价值观的国家决不能容忍迷信的蔓延及其传播者的势力。佛教寺院和道教宫观应被系统性地关闭，其教士受到严格限制，宗教则应转型为纯粹的私人信仰活动。"
 por_inquisition_policy: "葡萄牙宗教裁判所"
 por_inquisition_policy_desc: "一种仿照西班牙模式设立的宗教裁判所，由国家统筹组织与管理，但其人员主要由神职代理人、官僚以及被称为“亲信”的贵族成员构成。"
 icd_minority_religion_tt: "只要该政策有效，就会阻止选择其他[policies|e]。"
 dialects_of_tatar: "多元鞑靼认同"
 dialects_of_tatar_desc: "世界上有许多不同的鞑靼族群，尽管我们仅代表其中特定的一支，但我们依然承认并珍视彼此之间的差异。"
 dialects_of_tatar_tt: "在此政策下，鞑靼文化的人群不会被同化。非鞑靼文化的人群将被同化为相邻的鞑靼文化。“推广文化”内阁行动或“标记”内阁行动可覆盖此效果。"