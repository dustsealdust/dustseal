l_simp_chinese:
 alawite_religion: "阿拉维派"
 alawite_religion_ADJ: "阿拉维派"
 alawite_religion_desc: "一种由十二伊玛目派资深门徒创立的隐秘宗教，将诺斯替主义观点融入$shia_ADJ$信仰之中。该宗教对《古兰经》持有一种独特的秘传解读，主张伊斯兰教法已不再适用，并相信真主以三种形态显现，其中最后一种化身即为阿里·本·阿比·塔利卜。"
 southern_mahayana: "南传大乘佛教"
 southern_mahayana_ADJ: "南传大乘佛教"
 southern_mahayana_desc: "南传大乘佛教指的是源自$india$、并与密教相关的大乘佛教形式，后传入东南亚，并在当地发展出全新的世界观。尽管南传大乘佛教具备其他大乘$buddhist$分支的诸多基本特征——例如接受被称为大乘$sutra$的经典以及早期佛教经典，并强调$bodhisattva$这一形象——但它对密教金刚乘的觉悟修行实践有着独特的诠释，并深受藏传、缅甸和汉传佛教以及印度教的影响。"
 nusantaran_hindu: "努山达拉印度教"
 nusantaran_hindu_ADJ: "努山达拉印度教"
 nusantaran_hindu_desc: "$nusantaran_hindu$并非单一的宗教，而是指印度尼西亚盛行的相互关联的印度教-佛教信仰、实践和传统。这一信仰融合了佛教与印度教的理念，维护两者之间混合但等级制的关系，通常使佛教从属于印度教。同时，它也大量融入当地印尼民间信仰与传统。其重点在于$dharmic$宇宙秩序与解脱，以及对佛陀与涅槃的尊崇——例如，湿婆与佛陀常被等同视之。实践者通常不会只参与这一宗教的某种特定形式，而会同时前往佛教寺庙与印度教神庙，尽管佛教与印度教的僧侣通常各自独立，并为获得王室赞助而竞争。"
 anabaptist: "再洗礼派"
 anabaptist_ADJ: "再洗礼派"
 anabaptist_desc: "再洗礼派是基督教的一个分支，认为基督教应是一种有意识选择的信仰，由与世俗世界结构分离的信仰社群共同持守。在其教义中，再洗礼派认为只有受洗者能做出有意识决定时，洗礼才具有效力；他们拒绝等级制的祭司结构或国家教会。许多再洗礼派团体还践行和平主义、共享财物，并追求过简朴克己的生活。"
 unitarian: "一神论"
 unitarian_ADJ: "一位论派"
 unitarian_desc: "一位论派是基督教中一个非三位一体的派别，主要成形于波兰和特兰西瓦尼亚的宗教改革时期。一位论派信徒坚持上帝是唯一且不可分割的，他们认为耶稣是上帝所造的地位较低的造物。其他信仰可能不尽相同，但通常包括拒绝使用暴力以及强调人的自由意志。"
 icd_enable_polygamy: "启用[ShowPolicyName('icd_abrahamic_marriage')][policy|e]"
 malay_folk_religion: "马来宗教"
 malay_folk_religion_ADJ: "马来宗教"
 malay_folk_religion_desc: "$malay_folk_religion$$common_folk_religion_desc$"
 hyang_religion: "珦神崇拜"
 hyang_religion_ADJ: "珦神崇拜"
 hyang_religion_desc: "$hyang_religion$$common_folk_religion_desc$"
 lixue_school: "理学"
 lixue_school_desc: "理学将善赋予人便成为本性，将善赋予社会便成为“礼”；而人在世界万物纷扰交错中，很容易迷失自己禀赋自“理”的本性，社会便失去“礼”"
 xinxue_school: "心学"
 xinxue_school_desc: "心学，其思想渊源可追溯至陆九渊，但直至王阳明才得以系统化与发扬。该学派主张，由于人仅通过感官与经验来认识世界，个体便能在自身意识中发现真实，真实未必是外在的，而可通过内在加以理解。由于人们通过行动来认知，知与行并非分离，而是统一的。由此，该学派认为，研习学问并践行所学，才是领悟万物内在之善的真正途径。"
 yongjia_school: "永嘉学派"
 yongjia_school_desc: "永嘉学派提出了“事功”思想，亦是永嘉学派最大的特点，主张利与义的一致性，“以利和义，不以义抑利”，反对某些道学家的空谈义理或是无条件的付出。"
 yongkang_school: "永康学派"
 yongkang_school_desc: "永康学派是一种哲学流派，反对性命之说，主张功利之学，强调义利双行、王霸并用。陈傅良指出其特点为“功到成处，便是有德；事到济处，便是有理”，力求儒家学说切于实用，“开物成务”"
 kaozhenxue_school: "考据学派"
 kaozhenxue_school_desc: "考据学，即“实证研究”，是一种摒弃主观主义与内部分析的学术形式，而非常倚重天文学、地理学、数学、文献学等实证研究领域，并对古代文献进行严谨考究。考据学后来发展为汉学学派，更加注重标准化的学术研究。"
 zhedongxue_school: "浙东学派"
 zhedongxue_school_desc: "浙东学派是一个几乎完全专注于史学的儒家学派，认为过去是理解现实和当下的唯一途径。该学派呼吁回归传统，基于古代典籍而非后来的解释和附加内容，对儒家思想进行纯粹的理解。"
 songnihak_school: "性理学派"
 songnihak_school_desc: "性理学指的是韩国对儒家理学派的解释和扩展。性理学以其教条性和凝聚力为特征，强调对儒家思想家朱熹思想的绝对信奉。"
 silhak_school: "实学"
 silhak_school_desc: "实学，又称“实事求是之学”，是指在朝鲜为应对当地儒家思想中所谓不加辨析的教条主义而兴起的一场广泛改革运动。该学派主张一种立足于现实社会、注重实践层面的经验主义，反对过度沉溺于形而上学的思辨；同时主张变革僵化的儒家社会体制，推行土地改革以纾解农民疾苦，鼓励研习科学，并倡导与外国开展技术交流。"
 shenyan_school: "慎言"
 shenyan_school_desc: "《慎言》指的是王廷相的著作。该学派以极度异端为特征，宣扬仅凭“气”就能解释现实中的一切事物，主张“理”并不存在，因此善良与德性的倾向并非人性固有的特征，而是对社会规范和期望的回应。"
 quanzhen_school: "全真"
 quanzhen_school_desc: "全真道是道教的一个分支，专门以内丹修炼作为与道合一的主要手段。"
 zhengyi_dao: "正一道"
 zhengyi_dao_desc: "“正一”意为“正以治邪，一以统万”，是道教的一个分支，以其围绕天师世系的神权组织及其对符箓和特定仪式的重视而著称。它认为与道（存在的终极目标）的和谐不仅源于内在修行，也在于与外在契合。"
 musok_aspect: "朝鲜巫教"
 musok_aspect_desc: "巫俗是韩国的一种多神教萨满实践，通过萨满仪式与神灵和祖先沟通，以祈求庇佑。"
 tin_nguong_dan_gian: "越南民间信仰"
 tin_nguong_dan_gian_desc: "越南民间信仰是指越南本土的多神信仰。其具体表现形式包括对母神的崇拜，以及“灵”这一被视为神圣能量的观念——它划定界限、联结世间万物并孕育生成。"
 honji_suijaku: "本地垂迹说"
 honji_suijaku_desc: "本地垂迹是指佛陀选择以日本本土神祇的形态降临于日本，因此将神祇视为佛陀的或低阶或同等的显现。"
 inverted_honji_suijaku: "半本地垂迹"
 inverted_honji_suijaku_desc: "半本地垂迹又称“倒置的本地垂迹说”，是指日本本土的神祇乃是诸佛的本源与种子，而诸佛则为神祇的低阶显现。"
 yoshida_shinto: "吉田神道"
 yoshida_shinto_desc: "吉田神道是源于吉田兼俱教义的一个宗派，它进一步完善了“本地垂迹”思想，并致力于对神道进行系统化的整理。该派主张，神道乃是真正的原始宗教，一切法则皆由此而生。"
 fukko_shinto: "复古神道"
 fukko_shinto_desc: "复古神道是神道内部的一个宗派，旨在摒弃佛教与儒教的影响，重新强调该信仰的纯粹形态。它更注重历代相传的诸神教诲，而非佛教或儒教的观念体系。"
 SECT_PERFECT_TEACHING_NAME: "圆融宗"
 SECT_SOGATAN_NAME: "索加坦"
 perfect_teaching_policy: "圆融宗"
 perfect_teaching_policy_desc: "圆融宗是佛教的一个宗派，形成于辽国境内。它将密法修行与华严宗、禅宗以及普贤菩萨的教义相结合。该宗主张，由于一切佛法皆源于“一心”，因此可以将其整合为一个涵盖所有“实践”层面的完整体系。"
 sogatan_policy: "索加坦"
 sogatan_policy_desc: "“索伽坦”是古爪哇语中对佛教徒的称谓，指与印度教并行发展、在印度尼西亚逐渐成型的密宗佛教。"
 arianism: "阿里乌斯派"
 arianism_desc: "我们拒绝传统三位一体中三个位格平等的观点，而是认为基督作为先存的逻各斯，乃是上帝的另一个受造物。因此，尽管基督具有神性且先存，但他并不等同于上帝圣父。"
 nonadorantism: "非崇拜主义"
 nonadorantism_desc: "我们拒绝三位一体和基督的先存性，认为基督只是一个具有弥赛亚使命的人，通过童贞女或非童贞女怀孕而诞生。作为仅有人性的存在，基督不应被崇拜或敬拜，所有祷告必须唯独指向独一之神。"
 absolute_pacifism: "绝对和平主义"
 absolute_pacifism_desc: "使人和睦的人有福了，因为他们必称为神的儿"
 community_of_goods: "财产公有"
 community_of_goods_desc: "众信徒同心合意，凡物共有。他们把田地和产业卖掉，‌把所卖的价银拿来，放在使徒脚前，照各人所需用的，分给各人。"
 limited_divine_knowledge: "神圣无知"
 limited_divine_knowledge_desc: "上帝的无所不知仅限于那些未来必定会发生的确定真理。因人类选择和自由意志所产生的事件与情况，祂并不知晓。"
 icd_abrahamic_marriage: "圣经多妻制"
 icd_abrahamic_marriage_desc: "《圣经》认可一夫多妻制，否认这种古老的权利并非我们的职责。"
 icd_anabaptist_polygamy: "圣经多妻制"
 icd_anabaptist_polygamy_desc: "《圣经》认可一夫多妻制，否认这种古老的权利并非我们的职责。"
 icd_teetotalism: "禁酒主义"
 icd_teetotalism_desc: "饮酒一律禁止"
 icd_godhead: "神格成员"
 icd_godhead_desc: "每一位真正的基督徒都是三位一体之神的成员，并分享着上帝的恩典与爱。"
 icd_celestial_flesh: "天主血肉"
 icd_celestial_flesh_desc: "耶稣并非由圣母玛利亚孕育而成的肉身，而是其人性之躯直接自天而降"
 REFORMATION_HAS_ANABAPTIST_MOVEMENT: "[ShowReligionName('anabaptist')]运动活跃（再洗礼派正在传播）"
 clergy_estate_nusantaran_hindu: "学者"